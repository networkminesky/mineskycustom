plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
}

group = 'me.drawn'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }

    maven { url "https://repo.dmulloy2.net/repository/public/" }
    maven { url "https://maven.enginehub.org/repo/" }
    maven {
        url = uri("https://repo.opencollab.dev/main/")
    }

    maven { url 'https://jitpack.io' }
}

dependencies {
    paperweight.foliaDevBundle('26.1.2.build.+')

    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'

    compileOnly 'com.github.networkminesky:mineskyitems:dev~folia-SNAPSHOT'

    compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.4.4') {
        exclude group: 'org.apache.logging.log4j'
        exclude group: 'com.google.code.gson'
        exclude group: 'com.google.guava'
    }

    compileOnly('com.sk89q.worldguard:worldguard-bukkit:7.0.18-SNAPSHOT') {
        exclude group: 'org.apache.logging.log4j'
        exclude group: 'com.google.code.gson'
        exclude group: 'com.google.guava'
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
